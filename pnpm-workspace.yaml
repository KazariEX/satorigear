minimumReleaseAge: 0
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

packages:
  - packages/*
  - studio

catalog:
  "@zinkawaii/eslint-config": ^0.4.3
  "@zinkawaii/scripts": ^0.0.3
  "@zinkawaii/tsconfig": ^0.1.0
  bumpp: ^11.1.0
  eslint: ^10.5.0
  tsdown: ^0.22.2
  vitest: ^4.1.8

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
