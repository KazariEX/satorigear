name: codspeed

on:
  push:
    branches:
      - main
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Download Corpus
        run: pnpm run prepare:corpus

      - name: Run Benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pnpm run bench
