name: codspeed

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Prepare Corpus
        run: pnpm run prepare:corpus

      - name: Run Benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pnpm run benchmark:codspeed
