name: benchmark

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    if: "github.event.pull_request.title == 'docs: refresh benchmark results'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/setup@v3
        with:
          runtime: node@26

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Prepare Corpus
        run: pnpm run prepare:corpus

      - name: Refresh Benchmark
        run: pnpm run benchmark:docs

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          message: "docs: refresh benchmark results"
          default_author: github_actions
